spring.application.name=ProductServiceCapstone
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL}
# spring.datasource.url=jdbc:mysql://localhost:3306/ProductServiceCapstone
spring.datasource.username=${DB_UNAME}
# spring.datasource.username=ProductServiceCapstone_User
# spring.datasource.password=${DB_PASS}
# spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defalultZone=http://localhost:8761/eureka